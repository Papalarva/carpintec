<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath fill='%23b45f2b' d='M64 384l192-256 192 256H64zm256-128l64 96H128l64-96 96 128 96-128z'/%3E%3C/svg%3E">
    <title>Panel Admin - Madera Viva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos del admin (complementan styles.css) */
        .admin-nav {
            background: #1e3a5f;
            color: white;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }
        .admin-nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .admin-nav .tabs {
            display: flex;
            gap: 24px;
        }
        .admin-nav .tab {
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            padding: 8px 0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .admin-nav .tab.active {
            border-bottom-color: #f39c12;
        }
        .admin-content {
            padding: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .admin-section {
            display: none;
        }
        .admin-section.active {
            display: block;
        }
        /* Inventario */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .inventory-card {
            background: white;
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .inventory-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 12px;
        }
        .stock-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
        }
        .stock-control button {
            background: #e2e8f0;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 30px;
            cursor: pointer;
        }
        /* Solicitudes */
        .requests-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .request-card {
            background: white;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            gap: 16px;
            border-left: 6px solid;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .request-card.custom {
            border-left-color: #f39c12;
        }
        .request-card.express {
            border-left-color: #e74c3c;
        }
        .request-avatar {
            width: 60px;
            height: 60px;
            background: #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #666;
        }
        .request-details {
            flex: 1;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="admin-nav">
        <div class="logo"><i class="fas fa-tree"></i> CARPINTEC</div>
        <div class="tabs">
            <button class="tab active" data-tab="inventory"> Inventario</button>
            <button class="tab" data-tab="requests"> Solicitudes</button>
            <button class="tab" data-tab="stats"> Estadísticas</button>
        </div>
        <div>
            <i class="fas fa-sign-out-alt" id="adminLogoutBtn" style="cursor: pointer; font-size: 1.2rem;"></i>
        </div>
    </div>

    <div class="admin-content">
        <!-- Sección Inventario -->
        <div id="inventorySection" class="admin-section active">
            <h2>Gestión de Inventario</h2>
            <div class="inventory-grid" id="inventoryGrid"></div>
            <div class="admin-form" style="background:#f1f5f9; margin-top:30px;">
                <h3>Agregar nuevo producto</h3>
                <input type="text" id="newProductName" placeholder="Nombre">
                <select id="newProductCategory">
                    <option value="sala">Sala</option>
                    <option value="cocina">Cocina</option>
                    <option value="comedor">Comedor</option>
                    <option value="recamara">Recámara</option>
                    <option value="baño">Baño</option>
                </select>
                <input type="number" id="newProductPrice" placeholder="Precio">
                <input type="text" id="newProductImage" placeholder="URL de imagen">
                <textarea id="newProductDescription" placeholder="Descripción"></textarea>
                <input type="number" id="newProductStock" placeholder="Stock" value="10">
                <button id="addProductBtn" class="btn-primary">➕ Agregar producto</button>
            </div>
        </div>

        <!-- Sección Solicitudes (pedidos de usuarios) -->
        <div id="requestsSection" class="admin-section">
            <h2>Solicitudes de clientes</h2>
            <div class="requests-list" id="requestsList"></div>
        </div>

        <!-- Sección Estadísticas -->
        <div id="statsSection" class="admin-section">
            <h2>Estadísticas rápidas</h2>
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
